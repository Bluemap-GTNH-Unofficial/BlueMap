# Spotless/Blowdryer disabled: formatting follows the BlueMap repository, not GTNH's shared style.
gtnh.settings.blowdryerTag =

modName = BlueMap
modId = bluemap
modGroup = de.bluecolored.bluemap.gtnh
useModGroupForPublishing = true
autoUpdateBuildScript = false

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# Native Java 25 bytecode, no downgrading. Runs only on Java 25 via lwjgl3ify (as the GTNH 2.9 Java 17-26 server does).
enableModernJavaSyntax = modern

enableGenericInjection = false
generateGradleTokenClass = de.bluecolored.bluemap.gtnh.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =
apiPackage =
accessTransformersFile =

usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
# EndlessIDs / ChunkAPI need UniMixins in dev runs (runServer25).
forceEnableMixins = true

# BlueMap core/common and their libraries are shaded; relocations are listed in build.gradle.kts (upstream Forge list + gson).
usesShadowedDependencies = true
# Configurate, Caffeine and adventure use reflection/ServiceLoader; minimizing would drop classes they need.
minimizeShadowedDependencies = false
relocateShadowedDependencies = false

includeWellKnownRepositories = true
excludeWellKnownRepositories =

usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

disableSpotless = true
disableCheckstyle = true

# The project lives in a subdirectory of the BlueMap repo; version is set in build.gradle.kts instead.
gtnh.modules.gitVersion = false

# Kotlin stdlib is provided at runtime by Forgelin 2.0.3-GTNH; see dependencies.gradle.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx4G
# The included BlueMap build runs git at configuration time, which the configuration cache rejects.
org.gradle.configuration-cache = false
org.gradle.parallel = true
