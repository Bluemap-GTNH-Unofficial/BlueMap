/*
 * Pack mods match GT New Horizons 2.9.0-RC-2 and are provided by the pack at runtime.
 * BlueMap (from the enclosing BlueMap build, see settings.gradle.kts) is shaded and relocated, see build.gradle.kts.
 */
dependencies {
    // Kotlin runtime (stdlib 2.1.10, not relocated) comes from Forgelin; never shade it.
    devOnlyNonPublishable("com.github.GTNewHorizons:Forgelin:2.0.3-GTNH:dev")
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.1.10")

    shadowImplementation("de.bluecolored:bluemap-common")
    shadowImplementation("de.bluecolored:bluemap-legacy")
    if (file("../../gtnh-render/build.gradle.kts").isFile()) {
        shadowImplementation("de.bluecolored:bluemap-gtnh-render")
    }

    // 16-bit metadata and extended block/biome IDs at runtime (dev runs only; no compile-time API use).
    runtimeOnlyNonPublishable("com.falsepattern:chunkapi-mc1.7.10:0.8.4:dev")
    runtimeOnlyNonPublishable("com.falsepattern:endlessids-mc1.7.10:1.7.4:dev")

    testImplementation("org.jetbrains.kotlin:kotlin-stdlib:2.1.10")
    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
