org.gradle.jvmargs=-Xmx4G
# Local build cache in the Gradle user home. No configuration cache: buildSrc runs git at configuration time and
# :common:zipWebapp holds a Project reference.
org.gradle.caching=true
# Measured in the workspace container (2026-11-03): a clean :cli:shadowJar :legacy:addonJar :gtnh-render:addonJar took
# 138 s serial and 67 s parallel without the build cache, 73 s and 54 s with it; configuring only the projects the
# requested tasks need (not fabric, forge, neoforge, paper, spigot, sponge) took a no-op :legacy:test from 33-35 s to
# 23-24 s. When the server mod includes this build, its gradle.properties decide (parallel there as well; configure on
# demand does not reach an included build: measured 43-47 s either way for a no-op server mod `test`).
org.gradle.parallel=true
org.gradle.configureondemand=true

gradle-curseforge-publish.interop.fabric-loom=false
gradle-curseforge-publish.interop.neoforged=false
gradle-curseforge-publish.interop.neogradle=false

# Version of this fork: <bluemapUpstreamVersion>-gtnh.<gtnhRevision> (see buildSrc versioning.kt).
# bluemapUpstreamVersion: latest upstream BlueMap release tag reachable from the fork point afeddb83 (v5.29).
bluemapUpstreamVersion=5.29
gtnhRevision=2
